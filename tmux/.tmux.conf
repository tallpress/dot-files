unbind C-b
set -g prefix C-Space

bind-key C-Space last-window
set -g base-index 1

#################
# Mouse control #
#################
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# Use m and M to toggle mouse mode on and off respectively
unbind m
unbind M
bind-key m \
        set -w mouse on \;\
        display 'Mouse mode on'
bind-key M \
        set -w mouse off \;\
        display 'Mouse mode off'

# Vim-like key bindings for pane navigation (default uses cursor keys).
unbind h
bind h select-pane -L
unbind j
bind j select-pane -D
unbind k
bind k select-pane -U
unbind l # normally used for last-window
bind l select-pane -R

# Resizing (mouse also works).
unbind Left
bind -r Left resize-pane -L 5
unbind Right
bind -r Right resize-pane -R 5
unbind Down
bind -r Down resize-pane -D 5
unbind Up
bind -r Up resize-pane -U 5

# Intuitive window-splitting keys.
bind \\ split-window -h
bind - split-window -v

# Intuitive window shifting
bind b last-window

# List windows in session
bind Space run-shell "~/.local/scripts/tmux-session-menu"

# tmux-sessionizer
bind-key -r f display-popup -w 75% -h 75% -E "~/.local/scripts/tmux-sessionizer"
bind-key -r M-1 run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-2 run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-3 run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-4 run-shell "tmux neww tmux-sessionizer -s 3"

bind-key S display-popup -E -w 80% -h 80% "~/.local/scripts/tmux-claude-sessions"

# Daily note
bind-key q display-popup -w 80% -h 80% -E "~/.local/scripts/obsidian-daily"
# Quick notes
bind-key Q display-popup -w 80% -h 80% -E "nvim ~/notes/quick.md"
# Todos (open checkboxes across the vault)
bind-key t display-popup -w 80% -h 80% -E "~/.local/scripts/tmux-todos"

# Start window and pane numbering at 1, (0 is too hard to reach).
set -g base-index 1
set -g pane-base-index 1

set -g history-limit 20000


set-option -g default-shell "/bin/zsh"

# copy mode
setw -g mode-keys vi

# Theme colors (gruvbox)
set -g @bg "#282828"
set -g @bg1 "#3c3836"
set -g @fg "#ebdbb2"
set -g @gray "#928374"
set -g @accent "#458588"
set -g @accent2 "#8ec07c"
set -g @yellow "#d79921"

set-option -g status-style "bg=#{@bg1},fg=#{@fg}"
set-option -g status-right '[#{session_name}] %H:%M'
set-option -g status-left ' #{?window_zoomed_flag,#[fg=#{@yellow}] * #[default],   }'
set-option -g window-status-current-format '#[fg=#{@fg},bold] [#{window_index}:#W]'
set -g pane-border-style "fg=#{@bg1}"
set -g pane-active-border-style "bg=default fg=#{@accent}"
set-option -g status-position top
set -g mode-style "bg=#504945,fg=#{@fg}"
set -g menu-style "bg=#{@bg},fg=#{@fg}"
set -g menu-selected-style "bg=#{@accent},fg=#{@bg}"
set -g menu-border-style "fg=#{@bg1}"

# Style for inactive windows
set-option -g window-status-style "fg=#{@gray}"
set-option -g window-status-format ' #{window_index}:#W'

# Optional: format window titles
#set-option -g window-status-format "#I:#W"
#set-option -g window-status-current-format "#I:#W"

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
# Advertise true-colour (24-bit) support to apps like Neovim; without this tmux
# downsamples GUI colours to 256 and the gruvbox theme renders wrong.
set -as terminal-features ',*:RGB'

# Pass terminal focus events through to apps (e.g. Neovim's FocusGained), so an
# unmodified buffer auto-reloads the instant you switch back to its pane.
set -g focus-events on

# Notifications
# set -g visual-bell off
# # This example uses #S for session and #W for window name
# # set-hook -g alert-bell 'display-message "🔔 Alert: Activity in #S:#W!"'
# set-hook -g alert-bell 'display-popup -C  "echo \"\n   🔔 ALERT in #W:#S\""'
# set -g display-time 4000  # Message stays for 4 seconds

set -g @plugin 'tmux-plugins/tmux-resurrect'

