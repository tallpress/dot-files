unbind C-b
set -g prefix C-Space

bind-key C-Space last-window
set -g base-index 1

#################
# Mouse control #
#################
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# Use m and M to toggle mouse mode on and off respectively
unbind m
unbind M
bind-key m \
        set -w mouse on \;\
        display 'Mouse mode on'
bind-key M \
        set -w mouse off \;\
        display 'Mouse mode off'

# Vim-like key bindings for pane navigation (default uses cursor keys).
unbind h
bind h select-pane -L
unbind j
bind j select-pane -D
unbind k
bind k select-pane -U
unbind l # normally used for last-window
bind l select-pane -R

# Resizing (mouse also works).
unbind Left
bind -r Left resize-pane -L 5
unbind Right
bind -r Right resize-pane -R 5
unbind Down
bind -r Down resize-pane -D 5
unbind Up
bind -r Up resize-pane -U 5

# Intuitive window-splitting keys.
bind \\ split-window -h
bind - split-window -v

# Intuitive window shifting
bind b last-window

# tmux-sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r M-1 run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-2 run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-3 run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-4 run-shell "tmux neww tmux-sessionizer -s 3"

# Start window and pane numbering at 1, (0 is too hard to reach).
set -g base-index 1
set -g pane-base-index 1

set -g history-limit 20000


set-option -g default-shell "/bin/zsh"

# copy mode
setw -g mode-keys vi

# Theme 
set-option -g status-style bg=#458588,fg=#282828
set-option -g status-right '[#{session_name}] %H:%M'
set-option -g status-left ' #{?window_zoomed_flag, * ,   }'
set-option -g window-status-current-format '#[fg=black bg=#458588] [#{window_index}:#W]'
set -g pane-border-style fg=#458588
set -g pane-active-border-style "bg=default fg=#8ec07c"
set-option -g status-position bottom
set mode-style "bg=#458588"

# Style for active window
set-option -g window-status-style fg=black,bg=default

# Optional: format window titles
#set-option -g window-status-format "#I:#W"
#set-option -g window-status-current-format "#I:#W"

