[appearance]
fullscreen = true
theme = "gruvbox_dark"
# preview_theme = "gruvbox"

[hide]
inbox = true       # Hide _INBOX.* subjects
jetstream = true   # Hide $JS.* subjects

[columns]
marker = true      # Bookmark/import marker (★, I)
time = true        # Timestamp
type = false       # Message type (REQ/RES/PUB)
subject = true     # NATS subject
latency = false    # Response latency
payload = true     # Message payload preview

[connection]
url = "nats.127.0.0.1.local.atmta.cloud:4222"
user = "backend"
password = "password"

[[themes]]
name = "gruvbox_dark"
primary = "#fabd2f"       # bright_yellow - main accent
secondary = "#83a598"     # bright_blue
accent = "#fe8019"        # bright_orange
foreground = "#ebdbb2"    # fg
background = "#1d2021"    # bg_hard (darker)
success = "#b8bb26"       # bright_green
warning = "#d79921"       # yellow
error = "#fb4934"         # bright_red
surface = "#282828"       # bg (normal)
panel = "#3c3836"         # bg1
dark = true

[themes.variables]
block-cursor-background = "#ebdbb2"
block-cursor-foreground = "#1d2021"
block-cursor-text-style = "bold"
border = "#504945"
border-blurred = "#3c3836"
scrollbar = "#3c3836"
scrollbar-hover = "#504945"
scrollbar-active = "#665c54"
link-background = "#1d2021"
link-background-hover = "#282828"
link-color = "#83a598"
link-color-hover = "#83a598"
footer-background = "#282828"
footer-key-foreground = "#fabd2f"
footer-description-foreground = "#ebdbb2"
input-cursor-background = "#ebdbb2"
input-cursor-foreground = "#1d2021"
input-selection-background = "#504945"

